<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavorHub Express | Menu</title>
	<link rel="icon" type="image/png" href="F:\flavorhub\pngtree-orange-dotted-circle-png-image_14525083.png">
    <!-- Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind for custom colors and font --><script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#f55d3e', // Vibrant red-orange
                        'secondary': '#2c3e50', // Dark blue
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .add-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <!-- Header (Consistent Navigation) --><header class="sticky top-0 z-50 bg-secondary shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-extrabold text-primary tracking-tight transform hover:scale-105 transition duration-300">
                FlavorHub Express
            </a>
            <nav class="hidden md:flex space-x-6 text-white font-medium">
                <a href="index.html" class="hover:text-primary transition duration-200">Home</a>
                <a href="index.html#categories" class="text-primary border-b-2 border-primary pb-1">Categories</a>
                <a href="viewcart.html" class="hover:text-primary transition duration-200">Cart (<span id="cart-count">4</span>)</a>
            </nav>
            <button class="md:hidden text-white"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <!-- Main Content --><main class="flex-grow">
        
        <!-- Dynamic Category Hero Banner --><section class="relative bg-gray-900 text-white py-20 overflow-hidden">
            <!-- Background Image overlay --><div class="absolute inset-0 opacity-40">
                <!-- Using a stable Picsum URL for the hero image --><img id="hero-bg-img" src="https://images.pexels.com/photos/941861/pexels-photo-941861.jpeg?cs=srgb&dl=pexels-chanwalrus-941861.jpg&fm=jpg" class="w-full h-full object-cover">
            </div>
            <div class="container mx-auto px-6 relative z-10 text-center">
                <h1 id="category-title" class="text-5xl md:text-6xl font-extrabold mb-4 drop-shadow-lg capitalize">Menu</h1>
                <p class="text-xl text-gray-200 max-w-2xl mx-auto">Explore our wide selection of delicious dishes prepared just for you.</p>
            </div>
        </section>

        <!-- Filters & Sort --><div class="container mx-auto px-6 py-8 border-b border-gray-200">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p class="text-gray-500 mb-4 md:mb-0">Showing <span class="font-bold text-secondary">24</span> results for <span id="breadcrumb-cat" class="capitalize font-bold">Food</span></p>
                
                <div class="flex space-x-4">
                    <select class="bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        <option>Sort by: Popularity</option>
                        <option>Price: Low to High</option>
                        <option>Price: High to Low</option>
                        <option>Rating</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Food Grid --><div class="container mx-auto px-6 py-12">
            <div id="food-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- Initial loader to be replaced by JavaScript -->
                <div class="col-span-full text-center py-20">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto"></div>
                    <p class="mt-4 text-gray-500">Loading delicious items...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer --><footer class="bg-secondary text-gray-400 py-8 mt-auto">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2025 FlavorHub Express. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Logic --><script>
        // --- Custom Base64 SVG Placeholders (Guaranteed to Load) ---
        const svg1 = 'https://img.freepik.com/free-photo/penne-pasta-tomato-sauce-with-chicken-tomatoes-wooden-table_2829-19744.jpg?semt=ais_hybrid&w=740&q=80';
        const svg2 = 'https://img.freepik.com/premium-photo/plate-food-with-noodles-meat-vegetables_1197144-525.jpg?semt=ais_hybrid&w=740&q=80';
        const svg3 = 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8cGl6emF8ZW58MHx8MHx8fDA%3D';
		
		const svg4 = 'https://png.pngtree.com/thumb_back/fh260/background/20230204/pngtree-burger-fire-food-hd-background-image_1541161.jpg';
		
		const svg5 = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTexyPXo6aKkU79xRaRK5HeYyYnHBDpfz29WQ&s';
		
		const svg6 = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTl62omILNjKP1YGDy3YhyMa5dOzUrjCuUHgA&s';
		
		const svg7 = 'https://images.picxy.com/cache/2020/7/30/b0b59aa28e91040e7bc2384b230fee53.jpg';
		
		const svg8 = 'https://media.istockphoto.com/id/1143530040/photo/indian-naan-bread-with-garlic-butter-on-wooden-table.jpg?s=612x612&w=0&k=20&c=71SgbJtnfiHUiud1oGxnhiZsx5nuivWwZt8DlIk8hi0=';
		
		const svg9 = 'https://media.istockphoto.com/id/618457124/photo/butter-chicken-served-with-homemade-indian-naan-bread.jpg?s=612x612&w=0&k=20&c=7FoiHoDtocfPvQIaRFfFani4e5lkfMTNl_619rTTh4g=';
		
		const svg10 = 'https://thumbs.dreamstime.com/b/nachos-supreme-plate-delicious-tortilla-melted-cheese-sauce-ground-beef-jalapeno-peppers-red-onion-green-onions-tomato-53792653.jpg';
        
        const SVGS = [svg1, svg2, svg3, svg4, svg5, svg6, svg7, svg8, svg9, svg10];

        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM Content Loaded. Starting menu generation.');

            // 1. Get Category from URL
            const params = new URLSearchParams(window.location.search);
            const category = params.get('cat') || 'Specials'; 
            const gridContainer = document.getElementById('food-grid');
            
            if (!gridContainer) {
                console.error("Error: Could not find the food-grid container.");
                return;
            }

            try {
                // 2. Update Header/UI based on Category
                document.getElementById('category-title').textContent = `${category} Delights`;
                document.getElementById('breadcrumb-cat').textContent = category;
                
                // Set a relevant background mock image based on category
                const heroImg = document.getElementById('hero-bg-img');
                // Keeping the Unsplash hero image as it's less likely to be blocked than 24 product images
                heroImg.src = `https://images.pexels.com/photos/941861/pexels-photo-941861.jpeg?cs=srgb&dl=pexels-chanwalrus-941861.jpg&fm=jpg`;

                // 3. Define Mock Data Generators based on Category
                const foodVocabulary = {
                    'italian': { 
                        types: ['Pizza', 'Pasta', 'Lasagna', 'Risotto', 'Focaccia'], 
                        adjs: ['Cheesy', 'Spicy', 'Classic', 'Creamy', 'Gourmet']
                    },
                    'mexican': { 
                        types: ['Tacos', 'Burrito', 'Quesadilla', 'Nachos', 'Churros'], 
                        adjs: ['Spicy', 'Crispy', 'Loaded', 'Authentic', 'Chicken']
                    },
                    'indian': { 
                        types: ['Biryani', 'Curry', 'Masala', 'Naan', 'Tikka', 'Dosa'], 
                        adjs: ['Spicy', 'Butter', 'Paneer', 'Mutton', 'Vegetable']
                    },
                    'asian': { 
                        types: ['Sushi', 'Ramen', 'Dim Sum', 'Noodles', 'Fried Rice'], 
                        adjs: ['Dragon', 'Spicy', 'Steamed', 'Sticky', 'Teriyaki']
                    },
                    'burger': { 
                        types: ['Burger', 'Slider', 'Whopper', 'Cheeseburger', 'Stack'], 
                        adjs: ['Double', 'Vegan', 'Crispy', 'BBQ', 'Classic']
                    },
                    'sweets': {
                        types: ['Cake', 'Pastry', 'Ice Cream', 'Donut', 'Pudding'],
                        adjs: ['Chocolate', 'Vanilla', 'Strawberry', 'Warm', 'Decadent']
                    },
                    'default': { 
                        types: ['Bowl', 'Platter', 'Wrap', 'Sandwich', 'Special'], 
                        adjs: ['Chef\'s', 'Daily', 'Super', 'Fresh', 'Hot']
                    }
                };

                // Select vocabulary based on category
                const key = Object.keys(foodVocabulary).find(k => category.toLowerCase().includes(k)) || 'default';
                const vocab = foodVocabulary[key];

                // 4. Generate 24 Items
                let htmlContent = '';

                for (let i = 1; i <= 24; i++) { 
                    // Randomize Content
                    const type = vocab.types[Math.floor(Math.random() * vocab.types.length)];
                    const adj = vocab.adjs[Math.floor(Math.random() * vocab.adjs.length)];
                    const itemName = `${adj} ${type}`;
                    const itemId = i + 1000; 
                    
                    // Random Price between ₹150 and ₹950 (multiples of 10)
                    const price = Math.floor(Math.random() * (95 - 15 + 1) + 15) * 10; 
                    
                    // Random Rating 3.5 to 5.0
                    const rating = (Math.random() * (5.0 - 3.5) + 3.5).toFixed(1);
                    const reviewCount = Math.floor(Math.random() * 200) + 20;

                    // *** CRITICAL CHANGE: Using guaranteed Base64 SVG (no external network call) ***
                    const imageUrl = SVGS[i % SVGS.length];

                    // HTML Template for Card
                    htmlContent += `
                    <div class="product-card bg-white rounded-2xl shadow-md overflow-hidden flex flex-col h-full border border-gray-100">
                        <!-- Clickable Image Area --><a href="viewproduct.html?product_id=${itemId}&name=${encodeURIComponent(itemName)}" class="block relative h-48 overflow-hidden group">
                            <!-- Guaranteed image source (Base64 SVG) --><img src="${imageUrl}" 
                                 alt="${itemName}" 
                                 class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
                            <div class="absolute top-3 right-3 bg-white px-2 py-1 rounded-lg text-xs font-bold shadow text-secondary">
                                ⭐ ${rating} (${reviewCount})
                            </div>
                        </a>

                        <!-- Content Area --><div class="p-5 flex flex-col flex-grow">
                            <div class="mb-4 flex-grow">
                                <!-- Category Tag --><span class="inline-block px-2 py-1 bg-orange-100 text-orange-600 text-xs font-bold rounded-full mb-2 uppercase tracking-wide">
                                    ${category}
                                </span>
                                
                                <!-- Title (Clickable) --><a href="viewproduct.html?product_id=${itemId}&name=${encodeURIComponent(itemName)}" class="block">
                                    <h3 class="text-xl font-bold text-secondary hover:text-primary transition duration-200 line-clamp-1">${itemName}</h3>
                                </a>
                                
                                <p class="text-gray-500 text-sm mt-2 line-clamp-2">
                                    Delicious ${itemName.toLowerCase()} prepared with fresh ingredients and our secret blend of spices.
                                </p>
                            </div>

                            <!-- Price & Action --><div class="flex items-center justify-between pt-4 border-t border-gray-100">
                                <div>
                                    <span class="text-xs text-gray-400 block">Price</span>
                                    <span class="text-xl font-extrabold text-primary">₹${price}</span>
                                </div>
                                <button onclick="addToCart('${itemName}', ${price})" class="add-btn bg-secondary text-white p-3 rounded-xl hover:bg-primary transition duration-300 shadow-lg flex items-center justify-center">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    `;
                }

                // Inject content and replace the loader
                gridContainer.innerHTML = htmlContent;
                console.log('Menu generation complete. Content injected.');

            } catch (error) {
                // Display an error message if the generation failed
                gridContainer.innerHTML = `
                    <div class="col-span-full text-center py-20 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mx-auto max-w-lg">
                        <strong class="font-bold">Error loading menu:</strong>
                        <span class="block sm:inline">${error.message}. Please try refreshing the page.</span>
                    </div>`;
                console.error("Failed to generate and inject menu content:", error);
            }
        });

        // Simple notification Mock
        function addToCart(name, price) {
            // Update cart count visually
            const cartCount = document.getElementById('cart-count');
            let current = parseInt(cartCount.innerText);
            cartCount.innerText = current + 1;

            // Optional: Simple message box (using console for now, as alerts are blocked)
            console.log(`Added ${name} - ₹${price} to cart`);
        }
    </script>
<style>
    .cursor-dot {
        position: fixed;
        width: 10px;
        height: 10px;
        background-color: green;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.8;
        transform: translate(-50%, -50%);
        animation: fadeOut 0.6s linear forwards;
    }

    @keyframes fadeOut {
        from { opacity: 1; transform: scale(1) translate(-50%, -50%); }
        to { opacity: 0; transform: scale(0.3) translate(-50%, -50%); }
    }
</style>

<script>
    document.addEventListener("mousemove", (e) => {
        const dot = document.createElement("div");
        dot.classList.add("cursor-dot");
        dot.style.left = `${e.clientX}px`;
        dot.style.top = `${e.clientY}px`;
        document.body.appendChild(dot);

        setTimeout(() => {
            dot.remove();
        }, 600);
    });
</script>

</body>
</html>
